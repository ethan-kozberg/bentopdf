name: Build Windows exe
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep Unix line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Run npm scripts with bash
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies
        run: npm install

      - name: Add Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Bundle WASM and OCR files for offline use
        shell: bash
        run: |
          mkdir -p wasm-dl tmp-tess
          cd wasm-dl
          npm pack @bentopdf/pymupdf-wasm@0.11.16 @bentopdf/gs-wasm@0.1.1 coherentpdf@2.5.5 tesseract.js@7.0.0 tesseract.js-core@7.0.0
          cd ..
          W=public/wasm
          mkdir -p $W/pymupdf $W/gs $W/cpdf $W/ocr/core $W/ocr/lang-data $W/ocr/fonts
          tar xzf wasm-dl/bentopdf-pymupdf-wasm-*.tgz -C $W/pymupdf --strip-components=1
          tar xzf wasm-dl/bentopdf-gs-wasm-*.tgz -C $W/gs --strip-components=1
          tar xzf wasm-dl/coherentpdf-*.tgz -C $W/cpdf --strip-components=1
          tar xzf wasm-dl/tesseract.js-7*.tgz -C tmp-tess
          cp tmp-tess/package/dist/worker.min.js $W/ocr/worker.min.js
          tar xzf wasm-dl/tesseract.js-core-*.tgz -C $W/ocr/core --strip-components=1
          curl -fsSL https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz -o $W/ocr/lang-data/eng.traineddata.gz
          curl -fsSL https://raw.githack.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf -o $W/ocr/fonts/NotoSans-Regular.ttf

      - name: Generate Tauri project
        shell: bash
        run: |
          if [ ! -d src-tauri ]; then
            npx tauri init --ci \
              --app-name BentoPDF \
              --window-title BentoPDF \
              --frontend-dist ../dist \
              --dev-url http://localhost:5173 \
              --before-dev-command "npm run dev" \
              --before-build-command "npm run build"
          fi
          cp tauri.conf.override.json src-tauri/tauri.windows.conf.json

      - name: Build
        run: npx tauri build
        env:
          SIMPLE_MODE: "true"
          VITE_WASM_PYMUPDF_URL: http://tauri.localhost/wasm/pymupdf/
          VITE_WASM_GS_URL: http://tauri.localhost/wasm/gs/assets/
          VITE_WASM_CPDF_URL: http://tauri.localhost/wasm/cpdf/dist/
          VITE_TESSERACT_WORKER_URL: http://tauri.localhost/wasm/ocr/worker.min.js
          VITE_TESSERACT_CORE_URL: http://tauri.localhost/wasm/ocr/core
          VITE_TESSERACT_LANG_URL: http://tauri.localhost/wasm/ocr/lang-data
          VITE_TESSERACT_AVAILABLE_LANGUAGES: eng
          VITE_OCR_FONT_BASE_URL: http://tauri.localhost/wasm/ocr/fonts

      - uses: actions/upload-artifact@v4
        with:
          name: bentopdf-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
